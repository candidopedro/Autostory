<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Autostory · Login</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; font-family: system-ui, sans-serif; background: #f3f0ff; color: #1d1730; text-align: center; }
    @media (prefers-color-scheme: dark) { body { background: #0f0c1d; color: #f1eeff; } }
  </style>
</head>
<body>
  <p id="msg">Concluindo login…</p>
  <script>
    const error = new URLSearchParams(location.search).get('error');
    document.getElementById('msg').textContent = error ? error : 'Login concluído! Você já pode fechar esta janela.';
    if (window.opener && !window.opener.closed) {
      window.opener.postMessage({ type: 'autostory-auth', error }, location.origin);
      setTimeout(() => window.close(), error ? 2500 : 300);
    } else {
      setTimeout(() => location.replace('/?resume=1'), error ? 2500 : 300);
    }
  </script>
</body>
</html>
